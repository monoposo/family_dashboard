<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f3f5f8">
  <title>家族のダッシュボード</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="dashboard">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">⌂</div>
        <div>
          <p class="eyebrow">家族のダッシュボード</p>
          <h1 class="header-date">
            <span class="header-year" id="header-year">日付を読み込み中</span>
            <span class="header-full-date" id="header-full-date"></span>
            <span class="header-weekday" id="header-weekday"></span>
          </h1>
        </div>
      </div>
      <div class="updated" id="global-status">
        <span class="status-dot" aria-hidden="true"></span>
        <span id="global-status-text">データを更新中</span>
      </div>
    </header>

    <section class="top-grid" aria-label="今日の情報">
      <article class="card weather-clock-card" id="weather-card">
        <div class="weather-overview">
          <div class="weather-time-panel">
            <div class="weather-clock-info">
              <p class="weather-time-bubble" id="current-time">--:--</p>
            </div>
            <div class="current-reading" aria-label="現在の天気">
              <span class="current-icon" id="current-weather-icon" aria-hidden="true">--</span>
              <p class="current-temperature" id="current-temperature">--°</p>
            </div>
          </div>
        </div>
        <div class="weather-timeline" id="weather-timeline">
          <span class="timeline-now-dot" aria-label="現在時刻"></span>
          <ol class="timeline-points" id="weather-timeline-points" aria-label="時間帯別の天気予報"></ol>
        </div>
        <div class="weather-meta">
          <button class="weather-location" id="weather-refresh" type="button" title="天気を再取得">📍 東京</button>
          <span id="weather-updated">更新待機中</span>
        </div>
        <p class="card-error" id="weather-error" hidden>天気情報を取得できません。再取得をお試しください。</p>
      </article>
    </section>

    <section class="bottom-grid" aria-label="家族の予定と預けメダル">
      <article class="card calendar-card" id="calendar-card">
        <div class="card-heading section-heading">
          <h2>予定</h2>
          <span class="sample-tag">サンプル</span>
        </div>
        <div class="schedule-days" id="calendar-schedule">
          <section class="schedule-day" aria-labelledby="today-schedule-heading">
            <h3 class="schedule-day-heading">
              <span class="day-label today-label" id="today-schedule-heading">今日</span>
            </h3>
            <ul class="event-list" id="today-events"></ul>
          </section>
          <section class="schedule-day" aria-labelledby="tomorrow-schedule-heading">
            <h3 class="schedule-day-heading">
              <span class="day-label" id="tomorrow-schedule-heading">明日</span>
            </h3>
            <ul class="event-list" id="tomorrow-events"></ul>
          </section>
        </div>
        <p class="card-error" id="calendar-error" hidden>予定を取得できません。</p>
      </article>

      <article class="card medal-card" id="medal-card">
        <div class="card-heading section-heading">
          <div>
            <h2>預けメダル</h2>
            <p class="subtle">期限が近い順に表示</p>
          </div>
          <span class="sample-tag">サンプル</span>
        </div>
        <ul class="medal-list" id="medal-list"></ul>
        <p class="card-error" id="medal-error" hidden>メダル期限を取得できません。</p>
      </article>
    </section>
  </main>

  <script type="module" src="js/app.js"></script>
</body>
</html>
